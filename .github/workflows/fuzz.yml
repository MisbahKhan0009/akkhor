name: Fuzz

# Every target for a fixed time on each push to main. The corpus each run
# grows is kept in the cache, so runs build on each other. A crash, hang
# or out-of-memory fails the run and its input is uploaded; it becomes a
# test (tests/corpus/fuzz) before it is fixed.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "60"

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [pdf, pdf_reflow, pdf_write, epub, zip, markup, text, locator, mobi, fb2, cbz]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # The prebuilt cargo-fuzz is a musl build and would aim at musl:
      # the target is named below.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz
      - name: Corpus from the last runs
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Seeds from the test corpus
        run: sh fuzz/seed.sh
      - name: Run
        working-directory: fuzz
        run: |
          cargo fuzz run -O --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} -- \
            -max_total_time=${{ inputs.seconds || 60 }} -rss_limit_mb=2048 -timeout=20 -max_len=1048576
      - name: Keep the corpus small
        if: success()
        working-directory: fuzz
        run: cargo fuzz cmin -O --target x86_64-unknown-linux-gnu ${{ matrix.target }} corpus/${{ matrix.target }} -- -rss_limit_mb=2048 -timeout=20 || true
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
