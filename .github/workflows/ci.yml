name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features akkhor-flow/bundled-fonts
      - run: cargo test --workspace --features akkhor-flow/bundled-fonts
      - name: Robustness (damaged and hostile files, release build)
        run: cargo test --release -p akkhor --test robustness

  switches:
    name: Format switch ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [pdf, epub, txt, "pdf,pdf-cjk", "pdf,epub,txt"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: switches
      - run: cargo check -p akkhor --no-default-features --features "${{ matrix.features }}"
      - run: cargo check -p akkhor-android --no-default-features --features "${{ matrix.features }}"

  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libakkhor.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 24 -o jniLibs build --release -p akkhor-android
      - name: Report sizes
        run: |
          {
            echo "### libakkhor.so size (all formats)"
            echo "| ABI | size |"
            echo "|---|---|"
            for f in jniLibs/*/libakkhor.so; do
              abi=$(basename "$(dirname "$f")")
              echo "| $abi | $(du -h "$f" | cut -f1) ($(stat -c %s "$f") bytes) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la jniLibs/*
      - name: PDF-only and EPUB-only sizes (arm64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          for f in pdf epub; do
            cargo ndk -t arm64-v8a -P 24 -o "only-$f" build --release -p akkhor-android --no-default-features --features "$f"
            echo "| arm64-v8a, $f only | $(du -h only-$f/arm64-v8a/libakkhor.so | cut -f1) |" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: jniLibs

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: cargo build --release -p akkhor-cli
      - name: Generate a 2,000-page, ~300 MB PDF and a long Bangla text
        run: python3 scripts/make_fixtures.py --big 2000 --image-kb 150
      - name: Run
        run: |
          B=target/release/akkhor
          {
            echo "### Benchmarks"
            echo '```'
            echo "== big PDF, cold cache, last page"
            sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches' || true
            $B tests/fixtures/big.pdf --page 1999
            echo
            echo "== big PDF, warm, zoomed 512x512 tile"
            $B tests/fixtures/big.pdf --page 1000 --scale 6 --tile 1200,600,512,512
            echo
            echo "== Indic PDF"
            $B tests/fixtures/indic.pdf --scale 2 --out indic-pdf.png
            echo
            echo "== Bangla EPUB chapter"
            $B tests/fixtures/indic-sample.epub --page 0 --out epub-bn.png
            echo
            echo "== Hindi EPUB chapter (dusk theme)"
            $B tests/fixtures/indic-sample.epub --page 1 --theme dusk --out epub-hi.png
            echo
            echo "== English chapter with an image"
            $B tests/fixtures/indic-sample.epub --page 2 --theme sepia --out epub-en.png
            echo
            echo "== Long Bangla text (~1,000 pages): first page vs all pages"
            $B tests/fixtures/big-bn.txt --out big-bn.png
            echo
            echo "== Search the long Bangla text"
            $B tests/fixtures/big-bn.txt --search "যুক্তবর্ণ" | tail -1
            echo
            echo "== Bijoy-encoded text is detected"
            $B tests/fixtures/bijoy-sample.txt | grep encoding
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: "*.png"
