name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features akkhor-flow/bundled-fonts
      - run: cargo test --workspace --features akkhor-flow/bundled-fonts
      - name: Robustness (damaged and hostile files, release build)
        run: cargo test --release -p akkhor --test robustness
      - name: PDF text accuracy (character error rate per corpus PDF)
        run: |
          status=0
          cargo test --release -q -p akkhor-pdf --test accuracy --test accuracy_no_names --test accuracy_unknown_font -- --nocapture > accuracy.log 2>&1 || status=$?
          {
            echo "### PDF text accuracy"
            echo '```'
            grep -E "pdf/|file |test result|panicked" accuracy.log
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: Bijoy round trip
        run: cargo test --release -q -p akkhor-flow --test bijoy_roundtrip -- --nocapture
      - name: Android interface (Native.kt against the engine, every call from a JVM)
        run: |
          cargo build -p akkhor-android
          python3 scripts/check_native.py --java /tmp/jni
          javac -encoding UTF-8 -d /tmp/jni /tmp/jni/dev/akkhor/Native.java android/test/NativeTest.java
          java -Djava.library.path=target/debug -cp /tmp/jni NativeTest .

  switches:
    name: Format switch ${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [pdf, "pdf,pdf-scans", "pdf,pdf-standard-fonts", "pdf,pdf-write", epub, txt, mobi, fb2, cbz, "pdf,pdf-cjk", "pdf,epub,txt"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: switches
      - run: cargo check -p akkhor --no-default-features --features "${{ matrix.features }}"
      - run: cargo check -p akkhor-android --no-default-features --features "${{ matrix.features }}"
      - name: Standard fonts from the app (no embedded set)
        if: matrix.features == 'pdf'
        run: cargo test -p akkhor-pdf --no-default-features --features jpeg --test standard_fonts

  android:
    name: Android libraries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build libakkhor.so
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -P 24 -o jniLibs build --release -p akkhor-android
      - name: Report sizes
        run: |
          {
            echo "### libakkhor.so size (all formats)"
            echo "| ABI | size |"
            echo "|---|---|"
            for f in jniLibs/*/libakkhor.so; do
              abi=$(basename "$(dirname "$f")")
              echo "| $abi | $(du -h "$f" | cut -f1) ($(stat -c %s "$f") bytes) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          ls -la jniLibs/*
      - name: Sizes per feature set (arm64)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "| arm64-v8a build | bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in "pdf,epub,txt" "pdf,pdf-scans" "pdf" "epub,txt"; do
            out="only-${f//,/-}"
            cargo ndk -t arm64-v8a -P 24 -o "$out" build --release -p akkhor-android --no-default-features --features "$f"
            echo "| $f | $(stat -c %s $out/arm64-v8a/libakkhor.so) |" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: jniLibs
      - name: Benchmark for a phone (scripts/phone/README.md)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo ndk -t arm64-v8a -P 24 build --release -p akkhor-cli --bin akkhor-bench
          mkdir -p phone/books
          cp target/aarch64-linux-android/release/akkhor-bench scripts/phone/on-phone.sh scripts/phone/run.sh scripts/phone/README.md phone/
          cp tests/corpus/books/pdf/bn.chrome.two.pdf tests/corpus/books/pdf/hi.chrome.two.pdf \
             tests/corpus/books/pdf/bn.xelatex.two.pdf tests/corpus/tables/pdf/bn.writer.pdf \
             tests/fixtures/indic-sample.epub tests/corpus/books/bn-book.txt phone/books/
          echo "akkhor-bench (arm64-v8a): $(stat -c %s phone/akkhor-bench) bytes" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: akkhor-bench-arm64
          path: phone

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - run: cargo build --release -p akkhor-cli
      - name: Generate a 2,000-page, ~300 MB PDF and a long Bangla text
        run: python3 scripts/make_fixtures.py --big 2000 --image-kb 150
      - name: Run
        run: |
          B=target/release/akkhor
          {
            echo "### Benchmarks"
            echo '```'
            echo "== big PDF, cold cache, last page"
            sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches' || true
            $B tests/fixtures/big.pdf --page 1999
            echo
            echo "== big PDF, warm, zoomed 512x512 tile"
            $B tests/fixtures/big.pdf --page 1000 --scale 6 --tile 1200,600,512,512
            echo
            echo "== Indic PDF"
            $B tests/fixtures/indic.pdf --scale 2 --out indic-pdf.png
            echo
            echo "== Bangla EPUB chapter"
            $B tests/fixtures/indic-sample.epub --page 0 --out epub-bn.png
            echo
            echo "== Hindi EPUB chapter (dusk theme)"
            $B tests/fixtures/indic-sample.epub --page 1 --theme dusk --out epub-hi.png
            echo
            echo "== English chapter with an image"
            $B tests/fixtures/indic-sample.epub --page 2 --theme sepia --out epub-en.png
            echo
            echo "== Long Bangla text (~1,000 pages): first page vs all pages"
            $B tests/fixtures/big-bn.txt --out big-bn.png
            echo
            echo "== Search the long Bangla text"
            $B tests/fixtures/big-bn.txt --search "যুক্তবর্ণ" | tail -1
            echo
            echo "== Bijoy-encoded text is detected and converted"
            $B tests/fixtures/bijoy-sample.txt | grep encoding
            echo
            echo "== PDF text layer: first page (builds recovery tables) and again"
            $B tests/corpus/pdf/bn.libreoffice.pdf --text | sed -n 5p
            $B tests/corpus/pdf/hi.chrome.raw.pdf --text | sed -n 5,7p
            echo
            echo "== Search a Bangla PDF whose own text layer breaks the word"
            $B tests/corpus/pdf/bn.chrome.pdf --search "যুক্তাক্ষরের" | tail -2
            echo
            echo "== Reflow a two-column XeLaTeX book page for a phone (night theme)"
            $B tests/corpus/books/pdf/bn.xelatex.two.pdf --reflow --size 720x1280 --theme night --screen 1
            echo
            echo "== Reflowed text of a Chrome two-column book (headings, paragraphs, no running header)"
            $B tests/corpus/books/pdf/bn.chrome.two.pdf --reflow --text | head -12
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: renders
          path: "*.png"
