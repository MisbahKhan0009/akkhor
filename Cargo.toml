[workspace]
resolver = "3"
members = ["crates/akkhor-core", "crates/akkhor-pdf", "crates/akkhor-flow", "crates/akkhor-epub", "crates/akkhor", "crates/akkhor-cli", "crates/akkhor-android"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MisbahKhan0009/akkhor"
authors = ["Md. Misbah Khan"]

[workspace.dependencies]
akkhor-core = { path = "crates/akkhor-core", version = "0.1.0" }
akkhor-pdf = { path = "crates/akkhor-pdf", version = "0.1.0" }
akkhor-flow = { path = "crates/akkhor-flow", version = "0.1.0" }
akkhor-epub = { path = "crates/akkhor-epub", version = "0.1.0" }
akkhor = { path = "crates/akkhor", version = "0.1.0", default-features = false }

memmap2 = "0.9"
miniz_oxide = "0.8"
# PDF: hayro supplies the low-level PDF interpreter and image decoders.
hayro = { version = "0.9", default-features = false }
# Text: one font stack (read-fonts) shared by shaping and outlines.
# harfrust 0.15 shares read-fonts 0.46 with hayro's skrifa 0.49, so the
# binary carries a single font parser.
harfrust = "=0.15.0"
# Same read-fonts as harfrust and hayro: no second font parser.
skrifa = { version = "0.49", default-features = false, features = ["std"] }
# One rasterizer for everything: the same vello_cpu hayro draws PDFs with.
vello_cpu = "0.3"
kurbo = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Smallest binary, for size comparisons: cargo build --profile release-small
[profile.release-small]
inherits = "release"
opt-level = "z"
