[workspace]
resolver = "3"
members = ["crates/akkhor-core", "crates/akkhor-pdf", "crates/akkhor-flow", "crates/akkhor-epub", "crates/akkhor", "crates/akkhor-cli", "crates/akkhor-android"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/MisbahKhan0009/akkhor"
authors = ["Md. Misbah Khan"]

[workspace.dependencies]
akkhor-core = { path = "crates/akkhor-core", version = "0.1.0" }
akkhor-pdf = { path = "crates/akkhor-pdf", version = "0.1.0", default-features = false }
akkhor-flow = { path = "crates/akkhor-flow", version = "0.1.0" }
akkhor-epub = { path = "crates/akkhor-epub", version = "0.1.0" }
akkhor = { path = "crates/akkhor", version = "0.1.0", default-features = false }

memmap2 = "0.9"
miniz_oxide = "0.8"
# PDF: hayro supplies the low-level PDF interpreter and image decoders.
# Pinned: akkhor-pdf's shared render cache (lib.rs, `render_cache`) relies
# on hayro 0.9.0's RenderCache handing its Rc clones only to the context of
# one render. Re-read hayro's src/lib.rs before raising this.
hayro = { version = "=0.9.0", default-features = false }
# Text: one font stack (read-fonts) shared by shaping and outlines.
# harfrust 0.15 shares read-fonts 0.46 with hayro's skrifa 0.49, so the
# binary carries a single font parser.
harfrust = "=0.15.0"
# Same read-fonts as harfrust and hayro: no second font parser.
skrifa = { version = "0.49", default-features = false, features = ["std"] }
# One rasterizer for everything: the same vello_cpu hayro draws PDFs with.
vello_cpu = "0.3"
kurbo = "0.13"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Code that runs rarely or once per file is optimised for size, the
# rasterizer, interpreter and shaper for speed. Measured: 0.2 MB smaller,
# no change in render time (whole-library opt-level "s" or "z" came out
# larger, because of how it changes inlining under LTO).
[profile.release.package.hayro-jbig2]
opt-level = "s"
[profile.release.package.hayro-jpeg2000]
opt-level = "s"
[profile.release.package.hayro-ccitt]
opt-level = "s"
[profile.release.package.moxcms]
opt-level = "s"
[profile.release.package.hayro-font]
opt-level = "s"
[profile.release.package.hayro-cmap]
opt-level = "s"
[profile.release.package.hayro-postscript]
opt-level = "s"
[profile.release.package.pxfm]
opt-level = "s"
[profile.release.package.zune-jpeg]
opt-level = "s"
[profile.release.package.akkhor-epub]
opt-level = "s"

# Smallest binary, for size comparisons: cargo build --profile release-small
[profile.release-small]
inherits = "release"
opt-level = "z"

# hayro-syntax with a lazy page tree (see vendor/README.md).
[patch.crates-io]
hayro-syntax = { path = "vendor/hayro-syntax" }
