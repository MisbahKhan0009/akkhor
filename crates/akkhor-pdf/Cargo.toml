[package]
name = "akkhor-pdf"
description = "PDF support for the Akkhor reading engine: memory-mapped loading and tiled rendering."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["standard-fonts", "jpeg", "jbig2", "jpx", "ccitt"]
# Image decoders. JPEG is in nearly every PDF with photos; JBIG2 and CCITT
# hold scanned black-and-white pages; JPEG 2000 appears in scans and
# archives. Without one, such images are left blank.
jpeg = ["hayro-syntax/jpeg"]
jbig2 = ["hayro-syntax/jbig2"]
jpx = ["hayro-syntax/jpx"]
ccitt = ["hayro-syntax/ccitt"]
# Embeds the 14 standard PDF fonts (~a few hundred KB) for PDFs that use
# them without embedding. Most books embed their fonts.
standard-fonts = ["hayro/embed-fonts"]
# Embeds CJK character maps. Only needed for Chinese/Japanese/Korean PDFs.
cjk = ["hayro/embed-cmaps"]
# Uses the bundled Noto fonts as reference fonts for text recovery.
bundled-fonts = ["akkhor-flow/bundled-fonts"]

[dependencies]
akkhor-core.workspace = true
akkhor-flow.workspace = true
hayro.workspace = true
# The vendored parser (see vendor/README.md), named to choose its decoders.
hayro-syntax = { version = "0.9", default-features = false, features = ["std"] }
harfrust.workspace = true
skrifa.workspace = true

[dev-dependencies]
akkhor-flow = { workspace = true, features = ["bundled-fonts"] }
