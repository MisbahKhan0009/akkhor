[package]
name = "akkhor-flow"
description = "Reflowable text for the Akkhor engine: document model, Indic-aware shaping, line breaking, pagination and painting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["hyphenation", "images"]
# PNG and JPEG decoding for pictures in books. Both decoders are already in
# the binary when PDF support is on.
images = ["dep:png", "dep:zune-jpeg"]
# English hyphenation patterns (31 KB).
hyphenation = []
# Compiles Noto Serif (Latin), Noto Serif Bengali and Noto Serif Devanagari
# into the binary. Handy for tests and the CLI; apps should instead point the
# engine at font files on disk, which are memory-mapped on first use.
bundled-fonts = []

[dependencies]
akkhor-core.workspace = true
harfrust.workspace = true
vello_cpu.workspace = true
kurbo.workspace = true
png = { version = "0.18", optional = true }
zune-jpeg = { version = "0.5", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
# Unicode to Bijoy, to test our Bijoy to Unicode by round trip (MIT).
poriborton = "0.2"
