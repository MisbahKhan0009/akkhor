[package]
name = "akkhor-android"
description = "JNI bridge exposing the Akkhor engine to Android apps (class dev.akkhor.Native)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "akkhor"
crate-type = ["cdylib"]

# Format switches pass straight through to the engine, so an app can build a
# PDF-only or EPUB-only library.
[features]
default = ["pdf", "pdf-scans", "pdf-write", "epub", "txt", "mobi", "fb2", "cbz"]
pdf = ["akkhor/pdf", "flow"]
# JBIG2, CCITT and JPEG 2000 decoders for scanned pages.
pdf-scans = ["pdf", "akkhor/pdf-scans"]
pdf-cjk = ["akkhor/pdf-cjk"]
# Chosen pages saved as a new PDF (pdfWritePages).
pdf-write = ["pdf", "akkhor/pdf-write"]
# The 14 standard PDF fonts compiled in. Off by default on Android: the app
# registers the phone's fonts for them (registerStandardFont).
pdf-standard-fonts = ["pdf", "akkhor/pdf-standard-fonts"]
epub = ["akkhor/epub", "flow"]
txt = ["akkhor/txt", "flow"]
mobi = ["akkhor/mobi", "flow"]
fb2 = ["akkhor/fb2", "flow"]
# Comics: the page view (renderPageTile), no reflow.
cbz = ["akkhor/cbz", "flow"]
# Reflowable text (EPUB, MOBI, FB2, TXT, PDF reflow); switched on by any of them.
flow = []

[dependencies]
akkhor.workspace = true
jni-sys = "0.3"
