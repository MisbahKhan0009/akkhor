[package]
name = "akkhor-android"
description = "JNI bridge exposing the Akkhor engine to Android apps (class dev.akkhor.Native)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "akkhor"
crate-type = ["cdylib"]

# Format switches pass straight through to the engine, so an app can build a
# PDF-only or EPUB-only library.
[features]
default = ["pdf", "pdf-scans", "epub", "txt"]
pdf = ["akkhor/pdf"]
# JBIG2, CCITT and JPEG 2000 decoders for scanned pages.
pdf-scans = ["pdf", "akkhor/pdf-scans"]
pdf-cjk = ["akkhor/pdf-cjk"]
epub = ["akkhor/epub", "flow"]
txt = ["akkhor/txt", "flow"]
# Reflowable text (EPUB, TXT); switched on by either.
flow = []

[dependencies]
akkhor.workspace = true
jni-sys = "0.3"
