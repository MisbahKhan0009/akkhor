[package]
name = "akkhor"
description = "A tiny, fast reading engine that gets Indic scripts right: PDF, EPUB and text, with formats switched on and off at build time."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ebook", "epub", "pdf", "bangla", "devanagari"]
categories = ["text-processing", "rendering"]

# Each format is a switch. A format that is off is not compiled at all, so it
# adds nothing to the binary. A format that is on costs no RAM until a file of
# that format is opened.
[features]
default = ["pdf", "pdf-scans", "pdf-standard-fonts", "epub", "txt", "mobi", "fb2", "cbz"]
# PDFs, with JPEG images and the 14 standard PDF fonts.
# PDFs, reflow included (it uses the flow layout).
pdf = ["dep:akkhor-pdf", "akkhor-pdf/jpeg", "flow"]
# The 14 standard PDF fonts compiled in (about 0.27 MB). Without them, an
# app supplies them with `pdf::register_standard_font` (the phone's own
# fonts do); PDFs that embed their fonts, nearly all, need nothing.
pdf-standard-fonts = ["pdf", "akkhor-pdf/standard-fonts"]
# Decoders for scanned pages: JBIG2 and CCITT (black and white) and
# JPEG 2000. Common in scanned books; about 0.4 MB of code.
pdf-scans = ["pdf", "akkhor-pdf/jbig2", "akkhor-pdf/ccitt", "akkhor-pdf/jpx"]
# Embedded CJK character maps for Chinese/Japanese/Korean PDFs.
pdf-cjk = ["pdf", "akkhor-pdf/cjk"]
# Pages of a PDF saved as a new PDF (share a chapter, a few pages).
pdf-write = ["pdf", "akkhor-pdf/write"]
epub = ["dep:akkhor-epub", "flow"]
txt = ["flow"]
# Kindle books: MOBI 7, AZW, AZW3 (KF8), combined files, PalmDOC.
mobi = ["dep:akkhor-mobi", "flow"]
# FictionBook 2, plain or zipped.
fb2 = ["dep:akkhor-fb2", "flow"]
# Comic book archives (zip of pictures; WebP and GIF decoding included).
cbz = ["dep:akkhor-cbz", "flow"]
# The reflowable-text pipeline shared by EPUB, TXT and (later) MOBI and FB2.
flow = ["dep:akkhor-flow"]
# Compile Noto Serif fonts (Latin, Bengali, Devanagari) into the binary; PDF
# text recovery also uses them as reference fonts.
bundled-fonts = ["flow", "akkhor-flow/bundled-fonts", "akkhor-pdf?/bundled-fonts"]

[dependencies]
akkhor-core.workspace = true
akkhor-pdf = { workspace = true, optional = true }
akkhor-epub = { workspace = true, optional = true }
akkhor-mobi = { workspace = true, optional = true }
akkhor-fb2 = { workspace = true, optional = true }
akkhor-cbz = { workspace = true, optional = true }
akkhor-flow = { workspace = true, optional = true }

[dev-dependencies]
akkhor-flow = { workspace = true, features = ["bundled-fonts"] }
