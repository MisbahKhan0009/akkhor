[package]
name = "akkhor-cli"
description = "Benchmark and render tool for the Akkhor engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "akkhor"
path = "src/main.rs"

[[bin]]
name = "akkhor-bench"
path = "src/bin/akkhor-bench.rs"

[dependencies]
akkhor = { workspace = true, features = ["pdf", "pdf-standard-fonts", "epub", "txt", "mobi", "fb2", "cbz", "bundled-fonts"] }
png = "0.18"
