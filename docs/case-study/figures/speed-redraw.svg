   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #666666" x="7.2" y="46.959023" transform="rotate(-0 7.2 46.959023)">Every engine keeps what it parsed between draws. Akkhor shares one render cache per document since Phase 3.3 (5.4 → 2.3 ms on the first page, four bytes a pixel for all); MuPDF stays ahead.</text>
