  <g id="text_16">
   <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; fill: #666666" transform="translate(7.2 35.905869)">Not like for like. Akkhor: PDF, EPUB, TXT, Indic shaping and text recovery. MuPDF: PDF, XPS, EPUB, CBZ, ... (PyMuPDF wheel; fonts included).</text>
